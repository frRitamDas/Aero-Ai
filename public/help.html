ide lucide-circle-question-mark h-5 w-5 shrink-0" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><path d="M12 17h.01"></path></svg><span class="truncate">Help</span></a></div><div class="shrink-0 p-3"></div></div></div><div class="absolute right-0 top-0 h-full w-1 cursor-col-resize transition-colors duration-200 hover:bg-primary/10" role="separator" aria-orientation="vertical" aria-label="Resize sidebar"><div class="absolute inset-y-0 -right-1 w-3"></div></div></aside><div class="relative flex-1 flex flex-col h-full overflow-hidden bg-background"><header class="sticky top-0 z-40 md:hidden bg-background/80 backdrop-blur-2xl border-b border-border/50"><div class="flex items-center justify-between px-4 h-13"><button class="flex items-center gap-2.5 -ml-1 p-1 rounded-md hover:bg-muted/50 transition-colors" aria-label="Open menu"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-menu h-6 w-6 shrink-0" aria-hidden="true"><path d="M4 5h16"></path><path d="M4 12h16"></path><path d="M4 19h16"></path></svg></button><div class="flex items-center gap-2"><button type="button" class="rounded-full border border-neutral-300 bg-white text-sm text-neutral-900 transition-colors hover:bg-neutral-50 h-8 px-3.5">Sign in</button></div></div></header><main class="flex-1 overflow-y-auto overflow-x-hidden overscroll-y-contain [-webkit-overflow-scrolling:touch] transition-all duration-300 relative bg-background p-3 pt-4 pb-6 md:p-8 md:pb-8"><div class="max-w-6xl mx-auto  transition-all duration-300"><div class=""><div class="max-w-2xl mx-auto px-4 py-10"><h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-center">How can we help?</h1><p class="mt-3 text-sm sm:text-base text-muted-foreground text-center max-w-md mx-auto">Tell us what happened and attach a screen recording if it helps. We usually reply within 1–2 business days.</p><div class="mt-8 flex flex-col sm:flex-row items-center justify-center gap-3"><button class="btn-cta-pill btn-cta-pill--plain inline-flex h-11 items-center justify-center px-6 rounded-full text-sm text-white" style="font-weight:400">Message support</button><div class="flex items-center gap-1.5 text-sm text-muted-foreground"><span>or email</span><a href="mailto:support@lakai.in" class="text-foreground underline underline-offset-2">support@lakai.in</a><button class="p-1 rounded hover:bg-muted transition-colors" aria-label="Copy support email"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-copy h-3.5 w-3.5" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg></button></div></div><div class="mt-10 flex flex-col gap-2.5"><button class="w-full text-left rounded-xl border border-border/50 bg-card/30 px-4 sm:px-5 py-3.5 hover:bg-card/60 transition-colors"><div class="flex items-center justify-between gap-4"><h3 class="text-sm font-medium text-foreground">What are LAKAI Credits and how do they work?</h3><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down h-4 w-4 shrink-0 text-muted-foreground transition-transform duration-200" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></div><div class="grid transition-[grid-template-rows] duration-300 ease-in-out grid-rows-[0fr]"><div class="overflow-hidden"><p class="pt-2.5 text-[13px] text-muted-foreground leading-relaxed pr-6">Credits are what you spend to use LAKAI's tools — different tools cost different amounts per use. Your credits refresh every 30 days when your plan renews.</p></div></div></button><button class="w-full text-left rounded-xl border border-border/50 bg-card/30 px-4 sm:px-5 py-3.5 hover:bg-card/60 transition-colors"><div class="flex items-center justify-between gap-4"><h3 class="text-sm font-medium text-foreground">I ran out of credits before the month ended</h3><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down h-4 w-4 shrink-0 text-muted-foreground transition-transform duration-200" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></div><div class="grid transition-[grid-template-rows] duration-300 ease-in-out grid-rows-[0fr]"><div class="overflow-hidden"><p class="pt-2.5 text-[13px] text-muted-foreground leading-relaxed pr-6">You can grab more anytime from Settings → Billing, or upgrade to a higher plan for more credits each month. Unused credits don't roll over — your balance resets at renewal.</p></div></div></button><button class="w-full text-left rounded-xl border border-border/50 bg-card/30 px-4 sm:px-5 py-3.5 hover:bg-card/60 transition-colors"><div class="flex items-center justify-between gap-4"><h3 class="text-sm font-medium text-foreground">My generation failed — was I charged?</h3><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down h-4 w-4 shrink-0 text-muted-foreground transition-transform duration-200" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></div><div class="grid transition-[grid-template-rows] duration-300 ease-in-out grid-rows-[0fr]"><div class="overflow-hidden"><p class="pt-2.5 text-[13px] text-muted-foreground leading-relaxed pr-6">No. If a generation fails, we automatically refund the credits it would have cost — you'll see them back in your balance within a minute or two. If they don't reappear, message us with the tool and roughly when it happened.</p></div></div></button><button class="w-full text-left rounded-xl border border-border/50 bg-card/30 px-4 sm:px-5 py-3.5 hover:bg-card/60 transition-colors"><div class="flex items-center justify-between gap-4"><h3 class="text-sm font-medium text-foreground">A render is stuck or taking a long time</h3><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down h-4 w-4 shrink-0 text-muted-foreground transition-transform duration-200" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></div><div class="grid transition-[grid-template-rows] duration-300 ease-in-out grid-rows-[0fr]"><div class="overflow-hidden"><p class="pt-2.5 text-[13px] text-muted-foreground leading-relaxed pr-6">Most renders finish in under a couple of minutes. If one's been stuck much longer, refresh the page first — it's usually still processing in the background. Still stuck after that? Message us with the tool and when you started it.</p></div></div></button><button class="w-full text-left rounded-xl border border-border/50 bg-card/30 px-4 sm:px-5 py-3.5 hover:bg-card/60 transition-colors"><div class="flex items-center justify-between gap-4"><h3 class="text-sm font-medium text-foreground">How do I cancel my subscription?</h3><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down h-4 w-4 shrink-0 text-muted-foreground transition-transform duration-200" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></div><div class="grid transition-[grid-template-rows] duration-300 ease-in-out grid-rows-[0fr]"><div class="overflow-hidden"><p class="pt-2.5 text-[13px] text-muted-foreground leading-relaxed pr-6">Go to Settings and click Cancel subscription, then send us your cancellation request from the last step. We'll cancel your plan within 48 hours, and you keep access until the end of your current billing period — no long-term contracts.</p></div></div></button><button class="w-full text-left rounded-xl border border-border/50 bg-card/30 px-4 sm:px-5 py-3.5 hover:bg-card/60 transition-colors"><div class="flex items-center justify-between gap-4"><h3 class="text-sm font-medium text-foreground">Can I use my own footage, images and audio?</h3><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down h-4 w-4 shrink-0 text-muted-foreground transition-transform duration-200" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></div><div class="grid transition-[grid-template-rows] duration-300 ease-in-out grid-rows-[0fr]"><div class="overflow-hidden"><p class="pt-2.5 text-[13px] text-muted-foreground leading-relaxed pr-6">Yes. Most tools accept your own uploads — drop in existing footage, images, or audio and LAKAI will generate, edit, or enhance around it.</p></div></div></button><button class="w-full text-left rounded-xl border border-border/50 bg-card/30 px-4 sm:px-5 py-3.5 hover:bg-card/60 transition-colors"><div class="flex items-center justify-between gap-4"><h3 class="text-sm font-medium text-foreground">Can I monetize what I make with LAKAI?</h3><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down h-4 w-4 shrink-0 text-muted-foreground transition-transform duration-200" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></div><div class="grid transition-[grid-template-rows] duration-300 ease-in-out grid-rows-[0fr]"><div class="overflow-hidden"><p class="pt-2.5 text-[13px] text-muted-foreground leading-relaxed pr-6">Yes. Everything you create is yours to publish and monetize on YouTube, TikTok, Instagram, or anywhere else.</p></div></div></button><button class="w-full text-left rounded-xl border border-border/50 bg-card/30 px-4 sm:px-5 py-3.5 hover:bg-card/60 transition-colors"><div class="flex items-center justify-between gap-4"><h3 class="text-sm font-medium text-foreground">I'm not sure how to use a tool</h3><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down h-4 w-4 shrink-0 text-muted-foreground transition-transform duration-200" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></div><div class="grid transition-[grid-template-rows] duration-300 ease-in-out grid-rows-[0fr]"><div class="overflow-hidden"><p class="pt-2.5 text-[13px] text-muted-foreground leading-relaxed pr-6">Every tool page has a short description of what it does right at the top. Still stuck? Message support below and tell us what you're trying to make — we'll point you to the right tool.</p></div></div></button></div></div><!--$--><!--/$--></div></div></main></div></div><section aria-label="Notifications alt+T" tabindex="-1" aria-live="polite" aria-relevant="additions text" aria-atomic="false"></section><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><script src="_next/static/chunks/102a67e358ac219f.js" id="_R_" async=""></script><script>(self.__next_f=self.__next_f||[]).push([0])</script><script>self.__next_f.push([1,"1:\"$Sreact.fragment\"\n2:I[796316,[\"/_next/static/chunks/a832a68ae8ad899c.js?dpl=dpl_4HahgVWJse3pcFUxS7gE2EiBqTby\",\"/_next/static/chunks/77adf4ddfd51c5a6.js?dpl=dpl_4HahgVWJse3pcFUxS7gE2EiBqTby\",\"/_next/static/chunks/3cd3db983076accb.js?dpl=dpl_4HahgVWJse3pcFUxS7gE2EiBqTby\",\
